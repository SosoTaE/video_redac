    - generic [ref=e230]:
      - generic [ref=e231]: Textures in this pack are based on NASA elevation and imagery data. Colors and shades of the textures are tuned accordng to true-color photos made by Messenger, Viking and Cassini spacecrafts, and, of course, the Hubble Space Telescope.
      - generic [ref=e232]:
        - paragraph [ref=e233]: "NOTES:"
        - paragraph [ref=e234]: Some parts of the planets remain to be mapped. These “gaps” are filled with fictional terrain that corresponds with the rest of the landscape.
        - paragraph [ref=e235]: The colors are slightly more saturated in order to highlite a unique nature for each object.
        - paragraph [ref=e236]: "Earth textures are the most precise part of the pack: They are a result of merging and adjusting large amount of geo-data, space photos and images from NASA’s Blue Marble (which might well be the 2nd best collection of Earth’s textures available, so check it out)"
        - paragraph [ref=e237]: True Earth colors (as seen from space) may vary depending on the camera used, duration of exposure, lightning conditions and atmospheric conditions. Textures in our pack are sharp, bright and colorful.
        - paragraph [ref=e238]: Seasonal variations affect Earth’s flora and snow coverage. Earth in our textures has a lot of vegetation and less snow.
